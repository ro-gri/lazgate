name: lazgate-dev

services:
  bootstrap:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
      target: bootstrap
    environment:
      LAZ_DEV_HY2_PORT: ${LAZ_DEV_HY2_PORT:-18443}
      LAZ_DEV_AWG_PORT: ${LAZ_DEV_AWG_PORT:-18520}
    volumes:
      - server-data:/lab/server
      - hysteria-config:/lab/hysteria
      - amnezia-config:/lab/amnezia
    restart: "no"

  server:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
      target: server
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      LAZ_ADDR: 0.0.0.0:8088
      LAZ_DATA: /app/data/laz.db
      LAZ_AUTH_DATA: /app/data/auth.db
      LAZ_TRANSPORT_DATA: /app/data/transport.db
      LAZ_PUBLIC_BASE_URL: http://localhost:${LAZ_DEV_HTTP_PORT:-18088}
      LAZ_WEB_PREFIX: /admin
      LAZ_AGENT_GRPC_ADDR: 0.0.0.0:9443
      LAZ_AGENT_GRPC_TARGET: server:9443
      LAZ_AGENT_GRPC_CERT_FILE: /app/data/server.crt
      LAZ_AGENT_GRPC_KEY_FILE: /app/data/server.key
    ports:
      - "127.0.0.1:${LAZ_DEV_HTTP_PORT:-18088}:8088"
      - "127.0.0.1:${LAZ_DEV_SERVER_DEBUG_PORT:-40000}:40000"
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp:unconfined]
    volumes:
      - server-data:/app/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8088/healthz]
      interval: 5s
      timeout: 3s
      retries: 30

  hysteria:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
      target: hysteria
    depends_on:
      server:
        condition: service_healthy
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - hysteria-config:/lab:ro
      - hysteria-state:/var/lib/lazgate-agent
      - hysteria-files:/var/lib/lazgate-hysteria-files
    ports:
      - "127.0.0.1:${LAZ_DEV_HY2_PORT:-18443}:443/udp"
      - "127.0.0.1:${LAZ_DEV_HY2_SSH_PORT:-2222}:22"
      - "127.0.0.1:${LAZ_DEV_HY2_DEBUG_PORT:-40001}:40000"
    healthcheck:
      test: [CMD-SHELL, systemctl is-active --quiet hysteria-server lazgate-agent ssh]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  amnezia:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile
      target: amnezia
      args:
        NODE_IMAGE: ${LAZ_DEV_AWG_NODE_IMAGE:-ubuntu:24.04}
    depends_on:
      server:
        condition: service_healthy
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock, /tmp]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - amnezia-config:/lab:ro
      - amnezia-state:/var/lib/lazgate-agent
    ports:
      - "127.0.0.1:${LAZ_DEV_AWG_PORT:-18520}:51820/udp"
      - "127.0.0.1:${LAZ_DEV_AWG_SSH_PORT:-2223}:22"
      - "127.0.0.1:${LAZ_DEV_AWG_DEBUG_PORT:-40002}:40000"
    healthcheck:
      test: [CMD-SHELL, 'systemctl is-active --quiet lab-awg lazgate-agent ssh && awg show awg0 >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  server-data:
  hysteria-config:
  amnezia-config:
  hysteria-state:
  hysteria-files:
  amnezia-state:
